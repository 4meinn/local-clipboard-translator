[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-clipboard-translator"
version = "0.1.0"
description = "A tiny pixel mascot that translates whatever you copy, fully offline, using a local LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["PySide6>=6.7"]

[project.optional-dependencies]
dev = ["pillow", "pyinstaller"]

[project.gui-scripts]
lct = "lct.app:main"

[tool.setuptools.packages.find]
where = ["src"]
